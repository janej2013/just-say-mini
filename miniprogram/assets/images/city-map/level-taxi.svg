<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120">
  <!-- Oval Background -->
  <ellipse cx="80" cy="70" rx="75" ry="45" fill="#FFF9C4" opacity="0.9" />

  <!-- Road Patch -->
  <path d="M 20 80 L 140 80 L 130 110 L 30 110 Z" fill="#BDBDBD" />
  <path d="M 40 95 L 120 95" stroke="#FFF" stroke-width="2" stroke-dasharray="10 10" />

  <!-- Bus Stop Sign -->
  <g transform="translate(110, 30)">
    <rect x="8" y="0" width="4" height="60" fill="#795548" />
    <circle cx="10" cy="10" r="10" fill="#F44336" />
    <rect x="6" y="6" width="8" height="8" fill="#FFF" rx="1" />
  </g>

  <!-- Yellow Taxi -->
  <g transform="translate(30, 50)">
    <path d="M 10 20 L 20 5 L 60 5 L 70 20 L 80 20 Q 85 20 85 25 L 85 40 L -5 40 L -5 25 Q -5 20 0 20 Z" fill="#FFC107" />
    <rect x="22" y="7" width="36" height="12" fill="#E1F5FE" />
    <!-- Chequer Pattern -->
    <rect x="0" y="25" width="80" height="4" fill="#333" />
    <path d="M 0 25 h 4 v 4 h -4 z M 8 25 h 4 v 4 h -4 z M 16 25 h 4 v 4 h -4 z" fill="#FFF" /> 
    <!-- Wheels -->
    <circle cx="15" cy="40" r="8" fill="#333" />
    <circle cx="65" cy="40" r="8" fill="#333" />
    <circle cx="15" cy="40" r="3" fill="#DDD" />
    <circle cx="65" cy="40" r="3" fill="#DDD" />
    <!-- Taxi Light -->
    <rect x="35" y="-2" width="10" height="6" fill="#FFF" />
    <text x="36" y="4" font-family="sans-serif" font-size="4" font-weight="bold">TAXI</text>
  </g>
</svg>