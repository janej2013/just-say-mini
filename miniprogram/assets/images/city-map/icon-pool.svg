<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 130">
    <!-- Drop Shadow -->
    <circle cx="0" cy="8" r="40" fill="#0277BD" opacity="0.2" />
    
    <!-- 3D Extrusion Layer -->
    <circle cx="0" cy="5" r="40" fill="#0288D1" stroke="white" stroke-width="4" />
    
    <!-- Main Face Layer -->
    <circle cx="0" cy="0" r="40" fill="#03A9F4" stroke="white" stroke-width="4" />
    <circle cx="0" cy="0" r="34" fill="#81D4FA" />
    
    <!-- Icon Content: Pool -->
    <g transform="translate(-15, -15)">
        <path d="M 0 20 Q 7 15 15 20 T 30 20" fill="none" stroke="#01579B" stroke-width="3" />
        <path d="M 0 28 Q 7 23 15 28 T 30 28" fill="none" stroke="#01579B" stroke-width="3" />
        <path d="M 20 -5 L 20 15" stroke="#FFF" stroke-width="3" />
        <path d="M 28 -5 L 28 15" stroke="#FFF" stroke-width="3" />
        <path d="M 20 0 L 28 0" stroke="#FFF" stroke-width="3" />
        <path d="M 20 8 L 28 8" stroke="#FFF" stroke-width="3" />
    </g>
    
    <!-- Label -->
    <g transform="translate(0, 55)">
        <rect x="-30" y="-10" width="60" height="24" rx="12" fill="#03A9F4" opacity="0.2" />
        <rect x="-30" y="-12" width="60" height="24" rx="12" fill="white" stroke="#03A9F4" stroke-width="2" />
        <text x="0" y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="#0277BD" font-family="sans-serif">POOL</text>
    </g>
</svg>