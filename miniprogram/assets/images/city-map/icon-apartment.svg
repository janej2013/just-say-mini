<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 130">
    <!-- Drop Shadow -->
    <circle cx="0" cy="8" r="40" fill="#006064" opacity="0.2" />
    
    <!-- 3D Extrusion Layer -->
    <circle cx="0" cy="5" r="40" fill="#00838F" stroke="white" stroke-width="4" />
    
    <!-- Main Face Layer -->
    <circle cx="0" cy="0" r="40" fill="#00ACC1" stroke="white" stroke-width="4" />
    <circle cx="0" cy="0" r="34" fill="#4DD0E1" />
    
    <!-- Icon Content: Building -->
    <g transform="translate(-15, -20)">
        <rect x="0" y="0" width="30" height="45" fill="#006064" rx="2" />
        <rect x="5" y="5" width="8" height="8" fill="#E0F7FA" />
        <rect x="17" y="5" width="8" height="8" fill="#E0F7FA" />
        <rect x="5" y="18" width="8" height="8" fill="#E0F7FA" />
        <rect x="17" y="18" width="8" height="8" fill="#E0F7FA" />
        <rect x="5" y="31" width="8" height="8" fill="#E0F7FA" />
        <rect x="17" y="31" width="8" height="8" fill="#E0F7FA" />
    </g>
    
    <!-- Label -->
    <g transform="translate(0, 55)">
        <rect x="-35" y="-10" width="70" height="24" rx="12" fill="#00838F" opacity="0.2" />
        <rect x="-35" y="-12" width="70" height="24" rx="12" fill="white" stroke="#00ACC1" stroke-width="2" />
        <text x="0" y="4" text-anchor="middle" font-size="10" font-weight="bold" fill="#006064" font-family="sans-serif">APARTMENT</text>
    </g>
</svg>