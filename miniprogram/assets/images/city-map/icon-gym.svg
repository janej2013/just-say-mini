    <!-- Main Face Layer -->
    <circle cx="0" cy="0" r="40" fill="#5C6BC0" stroke="white" stroke-width="4" />
    <circle cx="0" cy="0" r="34" fill="#9FA8DA" />
    
    <!-- Icon Content: Dumbbell -->
    <g transform="translate(-15, -15)">
        <rect x="0" y="5" width="6" height="20" fill="#283593" rx="2" />
        <rect x="24" y="5" width="6" height="20" fill="#283593" rx="2" />
