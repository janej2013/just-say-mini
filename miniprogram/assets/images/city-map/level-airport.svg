<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150">
  <!-- Oval Background -->
  <ellipse cx="100" cy="85" rx="95" ry="60" fill="#ECEFF1" opacity="0.9" />
  
  <!-- Terminal Building -->
  <rect x="40" y="45" width="80" height="40" fill="#CFD8DC" />
  <rect x="50" y="55" width="60" height="20" fill="#90A4AE" />
  
  <!-- Control Tower -->
  <g transform="translate(130, 25)">
    <rect x="12" y="30" width="16" height="40" fill="#78909C" />
    <path d="M 0 30 L 40 30 L 35 10 L 5 10 Z" fill="#546E7A" />
    <rect x="18" y="0" width="4" height="10" fill="#455A64" />
  </g>
  
  <!-- Runway -->
  <path d="M 10 90 L 190 90 L 180 130 L 20 130 Z" fill="#455A64" />
  <path d="M 30 110 L 170 110" stroke="#FFF" stroke-width="4" stroke-dasharray="15 15" />
  
  <!-- Plane -->
  <g transform="translate(80, 100) rotate(-10) scale(0.8)">
     <path d="M 0 10 L 40 10 L 50 0 L 55 0 L 45 15 L 55 15 L 55 20 L 45 20 L 55 35 L 50 35 L 40 25 L 0 25 Z" fill="#FFF" />
     <path d="M 15 10 L 25 10 L 25 15 L 15 15" fill="#0288D1" />
  </g>
</svg>